services:
  starfeet-db:
    image: postgres:16-alpine
    container_name: starfeet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - starfeet_db_data:/var/lib/postgresql/data
    networks:
      - starfeet-internal

  starfeet-web:
    image: node:22-alpine
    container_name: starfeet-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - MARKETING_URL=${MARKETING_URL}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      starfeet-db:
        condition: service_healthy
    networks:
      - starfeet-internal
      - proxy-net
    labels:
      - "traefik.enable=true"
      
      # Routers para HTTPS con Let's Encrypt (HTTP es manejado globalmente por Traefik)
      - "traefik.http.routers.starfeet-web-https.rule=Host(`tienda.${DOMAIN}`) || Host(`kine.${DOMAIN}`) || Host(`dashboard.${DOMAIN}`)"
      - "traefik.http.routers.starfeet-web-https.entrypoints=websecure"
      - "traefik.http.routers.starfeet-web-https.tls=true"
      - "traefik.http.routers.starfeet-web-https.tls.certresolver=myresolver"
      - "traefik.http.routers.starfeet-web-https.middlewares=security-headers"
      
      # Puerto interno del servicio web de Next.js
      - "traefik.http.services.starfeet-web.loadbalancer.server.port=3000"

  starfeet-landing:
    image: node:22-alpine
    container_name: starfeet-landing
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    volumes:
      - /opt/docker/starfeet-landing:/app
      - /app/node_modules
      - /app/.next
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      
      # Router para HTTPS con Let's Encrypt para dev1.starfeet.ar
      - "traefik.http.routers.starfeet-landing-https.rule=Host(`dev1.starfeet.ar`)"
      - "traefik.http.routers.starfeet-landing-https.entrypoints=websecure"
      - "traefik.http.routers.starfeet-landing-https.tls=true"
      - "traefik.http.routers.starfeet-landing-https.tls.certresolver=myresolver"
      
      # Puerto interno del servicio web de Next.js
      - "traefik.http.services.starfeet-landing.loadbalancer.server.port=3000"

volumes:
  starfeet_db_data:

networks:
  starfeet-internal:
    driver: bridge
  proxy-net:
    external: true
