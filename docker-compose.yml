name: starfeet-dev

services:
  starfeet-db-dev:
    image: postgres:16-alpine
    container_name: starfeet-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - starfeet_core_db_dev_data:/var/lib/postgresql/data
    networks:
      - starfeet-dev-internal

  starfeet-web-dev:
    image: node:22-alpine
    container_name: starfeet-web-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      - APP_ENV=${APP_ENV}
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - AUTH_COOKIE_NAMESPACE=${AUTH_COOKIE_NAMESPACE}
      - NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN}
      - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN}
      - NEXT_PUBLIC_URL_TIENDA=${NEXT_PUBLIC_URL_TIENDA}
      - NEXT_PUBLIC_URL_KINE=${NEXT_PUBLIC_URL_KINE}
      - NEXT_PUBLIC_URL_DASHBOARD=${NEXT_PUBLIC_URL_DASHBOARD}
      - NEXT_PUBLIC_URL_LANDING=${NEXT_PUBLIC_URL_LANDING}
      - NEXT_PUBLIC_URL_MARKETING=${NEXT_PUBLIC_URL_MARKETING}
      - MARKETING_URL=${MARKETING_URL}
      - LANDING_URL=${LANDING_URL}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      starfeet-db-dev:
        condition: service_healthy
    networks:
      - starfeet-dev-internal
      - proxy-net
    labels:
      - "traefik.enable=true"
      
      # Routers para HTTPS con Let's Encrypt (HTTP es manejado globalmente por Traefik)
      - "traefik.http.routers.starfeet-web-https.rule=Host(`dev-tienda.${DOMAIN}`) || Host(`dev-kine.${DOMAIN}`) || Host(`dev-dashboard.${DOMAIN}`)"
      - "traefik.http.routers.starfeet-web-https.entrypoints=websecure"
      - "traefik.http.routers.starfeet-web-https.tls=true"
      - "traefik.http.routers.starfeet-web-https.tls.certresolver=myresolver"
      - "traefik.http.routers.starfeet-web-https.middlewares=security-headers"
      
      # Puerto interno del servicio web de Next.js
      - "traefik.http.services.starfeet-web.loadbalancer.server.port=3000"

  starfeet-home-dev:
    image: node:22-alpine
    container_name: starfeet-home-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL_LANDING}
    volumes:
      - /opt/docker/starfeet/starfeet-home:/app
      - /app/node_modules
      - /app/.next
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      
      # Router para HTTPS con Let's Encrypt para dev1.starfeet.ar
      - "traefik.http.routers.starfeet-home-https.rule=Host(`dev1.starfeet.ar`)"
      - "traefik.http.routers.starfeet-home-https.entrypoints=websecure"
      - "traefik.http.routers.starfeet-home-https.tls=true"
      - "traefik.http.routers.starfeet-home-https.tls.certresolver=myresolver"
      
      # Puerto interno del servicio web de Next.js
      - "traefik.http.services.starfeet-home.loadbalancer.server.port=3000"

volumes:
  starfeet_core_db_dev_data:
    name: starfeet-core-web_db_dev_data

networks:
  starfeet-dev-internal:
    driver: bridge
  proxy-net:
    external: true
